name: CI/CD Pipeline - Test, Lint & Auto-Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Lint Backend & Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Test & Build Steps
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Unit & Integration Tests with Coverage
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_jwt_secret_key_123456789' }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET || 'test_cookie_secret_key_123456789' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AIzaSyFakeKeyForTesting1234567890' }}
        run: npm run test:coverage

      - name: Build Backend (TypeScript Compilation)
        working-directory: backend
        run: npm run build

      # Frontend Lint & Build Steps
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint Checks
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend (Vite Production Build)
        working-directory: frontend
        run: npm run build

  deploy:
    name: Auto-Deploy to Render
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hooks (Backend & Frontend)
        env:
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK_URL" ] && [ -z "$RENDER_FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "::warning ::No Render deploy hook secrets configured (RENDER_BACKEND_DEPLOY_HOOK_URL or RENDER_FRONTEND_DEPLOY_HOOK_URL). Skipping webhook triggers."
            exit 0
          fi

          # 1. Trigger Backend Deployment
          if [ -n "$RENDER_BACKEND_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering Backend deployment on Render..."
            res_back=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_BACKEND_DEPLOY_HOOK_URL")
            status_back=$(echo "$res_back" | grep "HTTP_STATUS" | cut -d':' -f2)
            echo "Backend Render Response: $(echo "$res_back" | grep -v 'HTTP_STATUS')"
            if [ "$status_back" -ge 200 ] && [ "$status_back" -lt 300 ]; then
              echo "✅ Backend deployment successfully triggered (HTTP $status_back)."
            else
              echo "::error ::Backend deployment failed to trigger (HTTP $status_back)."
              exit 1
            fi
          fi

          # 2. Trigger Frontend Deployment (if configured)
          if [ -n "$RENDER_FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering Frontend deployment on Render..."
            res_front=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL")
            status_front=$(echo "$res_front" | grep "HTTP_STATUS" | cut -d':' -f2)
            echo "Frontend Render Response: $(echo "$res_front" | grep -v 'HTTP_STATUS')"
            if [ "$status_front" -ge 200 ] && [ "$status_front" -lt 300 ]; then
              echo "✅ Frontend deployment successfully triggered (HTTP $status_front)."
            else
              echo "::error ::Frontend deployment failed to trigger (HTTP $status_front)."
              exit 1
            fi
          fi
